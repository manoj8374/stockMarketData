name: Web app

on:
  push:
    paths: ['webapp/**', '.github/workflows/webapp.yml']
  pull_request:
    paths: ['webapp/**', '.github/workflows/webapp.yml']

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test -- --ci
      - run: npm run build

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/relay/package-lock.json
      - run: npm ci
      - run: npm test
